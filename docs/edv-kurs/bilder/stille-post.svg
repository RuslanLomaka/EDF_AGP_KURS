<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Stille Post mit vier KIs: In der Mitte steht Gemini als Spielleiter. Ein deutscher Satz reist im Kreis: 1. ChatGPT übersetzt in die erste Sprache, 2. Copilot in die zweite, 3. Le Chat in die dritte, 4. Duck.ai zurück ins Deutsche. Die drei Sprachen kommen per Zufall aus Europa, aus dem Nahen Osten oder Afrika und aus Asien. Nach jeder Runde kommen Sie zu Gemini zurück.</title>
