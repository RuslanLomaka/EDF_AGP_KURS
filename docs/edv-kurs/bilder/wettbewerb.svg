<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">So funktioniert der Wettbewerb: 1. 15 Minuten zu zweit mit der KI ausprobieren. 2. Das beste Ergebnis laut vorlesen. 3. Alle stimmen per Handzeichen ab, nicht für das eigene Team. Für jeden echten Fehler der KI gibt es einen Extrapunkt. 4. Am Ende gewinnt das Team mit den meisten Punkten die Goldene Gurke.</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="34.0" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="700">So läuft der Wettbewerb</text>
<line x1="44" y1="78" x2="44" y2="268" stroke="#d9dee4" stroke-width="4" stroke-linecap="round"/>
<circle cx="44" cy="80" r="16" fill="#1f4e79"/>
<text x="44" y="86.7" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="74" y="82.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">15 Min. zu zweit</text>
<text x="74" y="106.0" font-size="15" fill="#5b6672" text-anchor="start">so absurd wie möglich</text>
<circle cx="44" cy="154" r="16" fill="#1f4e79"/>
<text x="44" y="160.7" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="74" y="156.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Vorlesen</text>
<text x="74" y="180.0" font-size="15" fill="#5b6672" text-anchor="start">das beste Ergebnis</text>
<circle cx="44" cy="228" r="16" fill="#1f4e79"/>
<text x="44" y="234.7" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="74" y="230.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Abstimmen per Hand</text>
<text x="74" y="254.0" font-size="15" fill="#5b6672" text-anchor="start">+1 für jeden KI-Fehler</text>
<circle cx="330" cy="82" r="22" fill="#fff" stroke="#1f4e79" stroke-width="3"/>
<line x1="330" y1="82" x2="330" y2="68.8" stroke="#1f4e79" stroke-width="3" stroke-linecap="round"/>
<line x1="330" y1="82" x2="339.9" y2="86.4" stroke="#1f4e79" stroke-width="3" stroke-linecap="round"/>
<path d="M316 142 H346 a10 10 0 0 1 10 10 V164 a10 10 0 0 1 -10 10 H336 l-14 14 v-14 H316 a10 10 0 0 1 -10 -10 V152 a10 10 0 0 1 10 -10 Z" fill="#e8f0f8" stroke="#1f4e79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M312 226 l4 9 10 1 -8 6 3 10 -9 -5 -9 5 3 -10 -8 -6 10 -1 z" fill="#b8860b"/>
<path d="M334 226 l4 9 10 1 -8 6 3 10 -9 -5 -9 5 3 -10 -8 -6 10 -1 z" fill="#b8860b"/>
<path d="M356 226 l4 9 10 1 -8 6 3 10 -9 -5 -9 5 3 -10 -8 -6 10 -1 z" fill="#b8860b"/>
<circle cx="44" cy="302" r="16" fill="#b8860b"/>
<text x="44" y="308.7" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="74" y="304.0" font-size="18" fill="#b8860b" text-anchor="start" font-weight="700">Die Goldene Gurke</text>
<text x="74" y="328.0" font-size="15" fill="#5b6672" text-anchor="start">für das beste Team</text>
<path d="M290 300 h64 v10 a32 32 0 0 1 -64 0 z" fill="#fdf3c7" stroke="#b8860b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="314" y="340" width="16" height="22" rx="2" fill="#b8860b"/>
<rect x="298" y="362" width="48" height="12" rx="3" fill="#b8860b"/>
<ellipse cx="322" cy="282" rx="13" ry="30" fill="#4d9a3b" stroke="#2e6b25" stroke-width="3" transform="rotate(12 322 282)"/>
<circle cx="318" cy="268" r="2.2" fill="#2e6b25"/>
<circle cx="327" cy="280" r="2.2" fill="#2e6b25"/>
<circle cx="319" cy="292" r="2.2" fill="#2e6b25"/>
<circle cx="326" cy="302" r="2.2" fill="#2e6b25"/>
</svg>
