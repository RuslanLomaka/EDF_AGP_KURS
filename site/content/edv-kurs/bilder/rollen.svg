<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="380" height="620" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Drei Rollen beim Teilen: Betrachter dürfen nur lesen. Kommentatoren dürfen lesen und kommentieren. Mitbearbeiter dürfen alles ändern.</title>
  <rect width="380" height="620" fill="#ffffff"/>
  <g text-anchor="middle">
    <g transform="translate(55 0)">
    <rect x="20" y="20" width="230" height="190" rx="12" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
    <ellipse cx="135" cy="80" rx="42" ry="24" fill="#fff" stroke="#5f6368" stroke-width="4"/><circle cx="135" cy="80" r="11" fill="#5f6368"/>
    <text x="135" y="140" font-size="20" font-weight="700" fill="#202124">Betrachter</text>
    <text x="135" y="168" font-size="15" fill="#333">nur lesen</text>
    </g>
    <g transform="translate(-190 200)">
    <rect x="265" y="20" width="230" height="190" rx="12" fill="#fef7e0" stroke="#e37400" stroke-width="2"/>
    <path d="M345 56 h80 a8 8 0 0 1 8 8 v34 a8 8 0 0 1 -8 8 h-48 l-14 14 v-14 h-18 a8 8 0 0 1 -8 -8 v-34 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#e37400" stroke-width="4"/>
    <text x="380" y="140" font-size="20" font-weight="700" fill="#202124">Kommentator</text>
    <text x="380" y="168" font-size="15" fill="#333">lesen und kommentieren,</text>
    <text x="380" y="188" font-size="15" fill="#333">Änderungen vorschlagen</text>
    </g>
    <g transform="translate(-435 400)">
    <rect x="510" y="20" width="230" height="190" rx="12" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
    <g transform="translate(625 80) rotate(-45)"><rect x="-44" y="-10" width="70" height="20" fill="#fff" stroke="#137333" stroke-width="4"/><path d="M26 -10 L46 0 L26 10z" fill="#137333"/></g>
    <text x="625" y="140" font-size="20" font-weight="700" fill="#202124">Mitbearbeiter</text>
    <text x="625" y="168" font-size="15" fill="#333">alles ändern,</text>
    <text x="625" y="188" font-size="15" fill="#333">auch selbst teilen</text>
    </g>
  </g>
</svg>
