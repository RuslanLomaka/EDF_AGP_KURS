<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 710" width="380" height="710" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Links: Word ist ein Programm auf dem PC, die Datei liegt auf dem PC. Rechts: Google Docs läuft im Browser, die Datei liegt im Internet und ist von PC und Handy erreichbar.</title>
  <rect width="380" height="710" fill="#ffffff"/>
  <!-- left: program on the PC -->
  <text x="190" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3864">Word: Programm auf dem PC</text>
  <rect x="60" y="60" width="260" height="170" rx="10" fill="#eef3fb" stroke="#1f3864" stroke-width="3"/>
  <rect x="60" y="60" width="260" height="30" rx="10" fill="#2b579a"/>
  <text x="76" y="81" font-size="15" fill="#fff">Brief.docx – installiertes Programm</text>
  <rect x="100" y="104" width="180" height="110" fill="#fff" stroke="#9aa9c4"/>
  <g stroke="#9aa9c4" stroke-width="5"><line x1="115" y1="125" x2="250" y2="125"/><line x1="115" y1="145" x2="265" y2="145"/><line x1="115" y1="165" x2="235" y2="165"/><line x1="115" y1="185" x2="255" y2="185"/></g>
  <rect x="150" y="230" width="80" height="14" fill="#1f3864"/><rect x="120" y="244" width="140" height="10" rx="3" fill="#1f3864"/>
  <text x="190" y="290" text-anchor="middle" font-size="16" fill="#333">Die Datei liegt auf <tspan font-weight="700">diesem PC</tspan></text>
  <text x="190" y="314" text-anchor="middle" font-size="16" fill="#333">oder auf dem USB-Stick.</text>
  <text x="190" y="338" text-anchor="middle" font-size="16" fill="#333">Funktioniert auch ohne Internet.</text>
<g transform="translate(-380 360)">
  <!-- right: browser + cloud -->
  <text x="570" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#137333">Google Docs: im Browser</text>
  <path d="M520 112 a34 34 0 0 1 64 -14 a26 26 0 0 1 46 22 a22 22 0 0 1 -6 44 h-104 a28 28 0 0 1 0 -52z" fill="#e6f4ea" stroke="#137333" stroke-width="3"/>
  <text x="570" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#137333">Internet (Cloud)</text>
  <rect x="430" y="196" width="190" height="112" rx="8" fill="#fff" stroke="#137333" stroke-width="3"/>
  <rect x="430" y="196" width="190" height="24" rx="8" fill="#e8eaed"/>
  <rect x="442" y="201" width="166" height="14" rx="7" fill="#fff" stroke="#bdc1c6"/>
  <text x="450" y="212" font-size="11" fill="#555">docs.google.com</text>
  <g stroke="#a8c7b0" stroke-width="5"><line x1="450" y1="240" x2="590" y2="240"/><line x1="450" y1="258" x2="600" y2="258"/><line x1="450" y1="276" x2="570" y2="276"/></g>
  <text x="525" y="300" text-anchor="middle" font-size="12" fill="#137333">Browser am PC</text>
  <rect x="660" y="206" width="56" height="100" rx="10" fill="#fff" stroke="#137333" stroke-width="3"/>
  <g stroke="#a8c7b0" stroke-width="4"><line x1="670" y1="230" x2="706" y2="230"/><line x1="670" y1="244" x2="702" y2="244"/><line x1="670" y1="258" x2="706" y2="258"/></g>
  <text x="688" y="296" text-anchor="middle" font-size="12" fill="#137333">Handy</text>
  <g stroke="#137333" stroke-width="3" stroke-dasharray="6 5" fill="none"><line x1="545" y1="166" x2="525" y2="194"/><line x1="610" y1="166" x2="680" y2="204"/></g>
  <text x="570" y="338" text-anchor="middle" font-size="16" fill="#333">Die Datei liegt <tspan font-weight="700">im Internet</tspan> – überall erreichbar.</text>
  <line x1="20" y1="352" x2="360" y2="352" stroke="#d0d0d0" stroke-width="2"/>
</g>
</svg>
