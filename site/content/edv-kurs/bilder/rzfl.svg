<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Ein guter Prompt hat vier Bausteine, R-Z-F-L: Rolle – „Du bist Bewerbungstrainerin.“ Ziel – „Hilf mir, eine E-Mail zu schreiben.“ Format – „als kurze Liste“. Länge – „höchstens 5 Sätze“.</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="34.0" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="700">Ein guter Prompt: R-Z-F-L</text>
<rect x="16" y="56" width="368" height="72" rx="14" fill="#e8f0f8" stroke="#1f4e79" stroke-width="2"/>
<circle cx="54" cy="92" r="24" fill="#1f4e79"/>
<text x="54" y="101.0" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">R</text>
<text x="92" y="86.0" font-size="19" fill="#1f4e79" text-anchor="start" font-weight="700">Rolle</text>
<text x="92" y="111.0" font-size="16" fill="#1d232b" text-anchor="start">„Du bist Bewerbungstrainerin.“</text>
<rect x="16" y="138" width="368" height="72" rx="14" fill="#e7f3e8" stroke="#2e7d32" stroke-width="2"/>
<circle cx="54" cy="174" r="24" fill="#2e7d32"/>
<text x="54" y="183.0" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">Z</text>
<text x="92" y="168.0" font-size="19" fill="#2e7d32" text-anchor="start" font-weight="700">Ziel</text>
<text x="92" y="193.0" font-size="16" fill="#1d232b" text-anchor="start">„Hilf mir bei einer E-Mail.“</text>
<rect x="16" y="220" width="368" height="72" rx="14" fill="#fff3df" stroke="#b26a00" stroke-width="2"/>
<circle cx="54" cy="256" r="24" fill="#b26a00"/>
<text x="54" y="265.0" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">F</text>
<text x="92" y="250.0" font-size="19" fill="#b26a00" text-anchor="start" font-weight="700">Format</text>
<text x="92" y="275.0" font-size="16" fill="#1d232b" text-anchor="start">„als kurze Liste“</text>
<rect x="16" y="302" width="368" height="72" rx="14" fill="#f1eaf8" stroke="#6a3d9a" stroke-width="2"/>
<circle cx="54" cy="338" r="24" fill="#6a3d9a"/>
<text x="54" y="347.0" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">L</text>
<text x="92" y="332.0" font-size="19" fill="#6a3d9a" text-anchor="start" font-weight="700">Länge</text>
<text x="92" y="357.0" font-size="16" fill="#1d232b" text-anchor="start">„höchstens 5 Sätze“</text>
</svg>
