<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">So sieht eine Bewerbung per E-Mail aus: 1. An: die E-Mail-Adresse aus der Stellenanzeige. 2. Betreff: Bewerbung als Lagerhelfer und die Kennziffer. 3. Der Text: Anrede mit Namen, wenige Sätze, Gruß und Ihre Kontaktdaten. 4. Der Anhang: ein PDF mit Ihrem Namen im Dateinamen. 5. Senden – erst, wenn alles geprüft ist.</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="32.0" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="700">Die Bewerbung per E-Mail</text>
<rect x="20" y="48" width="360" height="334" rx="14" fill="#fff" stroke="#d9dee4" stroke-width="2"/>
<rect x="20" y="48" width="360" height="34" rx="14" fill="#e8f0f8"/>
<rect x="20" y="66" width="360" height="16" rx="0" fill="#e8f0f8"/>
<text x="36" y="71.0" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="700">Neue Nachricht</text>
<circle cx="40" cy="101" r="12" fill="#1f4e79"/>
<text x="40" y="106.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="60" y="106.0" font-size="15" fill="#5b6672" text-anchor="start" font-weight="700">An:</text>
<text x="128" y="106.0" font-size="15" fill="#1d232b" text-anchor="start">jobs@muster-logistik.de</text>
<line x1="56" y1="118" x2="368" y2="118" stroke="#d9dee4" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="40" cy="137" r="12" fill="#1f4e79"/>
<text x="40" y="142.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="60" y="142.0" font-size="15" fill="#5b6672" text-anchor="start" font-weight="700">Betreff:</text>
<text x="128" y="142.0" font-size="15" fill="#1d232b" text-anchor="start">Bewerbung als Lagerhelfer, Nr. 4711</text>
<line x1="56" y1="154" x2="368" y2="154" stroke="#d9dee4" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="40" cy="175" r="12" fill="#1f4e79"/>
<text x="40" y="180.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="60" y="180.0" font-size="15" fill="#1d232b" text-anchor="start">Sehr geehrte Frau Weber,</text>
<text x="60" y="200.2" font-size="15" fill="#1d232b" text-anchor="start">im Anhang finden Sie meine</text>
<text x="60" y="220.5" font-size="15" fill="#1d232b" text-anchor="start">Bewerbung als Lagerhelfer …</text>
<text x="60" y="240.8" font-size="15" fill="#1d232b" text-anchor="start">Mit freundlichen Grüßen</text>
<text x="60" y="261.0" font-size="15" fill="#1d232b" text-anchor="start">Max Mustermann · Tel. 0123 456789</text>
<circle cx="40" cy="302" r="12" fill="#1f4e79"/>
<text x="40" y="307.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<rect x="58" y="286" width="300" height="32" rx="16" fill="#e7f3e8" stroke="#2e7d32" stroke-width="1.5"/>
<path d="M76 296 l0 12 a5 5 0 0 0 10 0 l0 -14 a3 3 0 0 0 -6 0 l0 13" fill="None" stroke="#2e7d32" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="96" y="307.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="700">Bewerbung_Mustermann_Max.pdf</text>
<circle cx="40" cy="353" r="12" fill="#1f4e79"/>
<text x="40" y="358.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<rect x="58" y="337" width="104" height="34" rx="17" fill="#1f4e79"/>
<text x="110" y="359.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Senden</text>
<text x="176" y="359.0" font-size="15" fill="#5b6672" text-anchor="start">erst nach der Prüfung!</text>
</svg>
