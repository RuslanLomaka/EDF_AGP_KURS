<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Eine Fake-Stellenanzeige mit sechs Warnzeichen: 1. Sehr viel Geld für wenig Arbeit, 3.000 Euro für 2 Stunden am Tag. 2. Keine Firma, keine Adresse. 3. Kontakt nur per WhatsApp. 4. Sie sollen Geld oder Pakete über Ihr Konto oder Ihre Adresse weiterleiten. 5. Ausweis und Kontodaten schon vor dem Gespräch. 6. Druck: nur heute!</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="32.0" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">Echt oder Fake? 6 Warnzeichen</text>
<rect x="20" y="48" width="360" height="338" rx="14" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="44" cy="86" r="13" fill="#c0392b"/>
<text x="44" y="91.5" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="68" y="82.0" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">3.000 € für 2 Std. am Tag!</text>
<text x="68" y="102.0" font-size="14" fill="#5b6672" text-anchor="start">viel Geld, wenig Arbeit</text>
<line x1="36" y1="114" x2="364" y2="114" stroke="#d9dee4" stroke-width="1" stroke-linecap="round"/>
<circle cx="44" cy="137" r="13" fill="#c0392b"/>
<text x="44" y="142.5" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="68" y="133.0" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">Absender: „Ihr Job-Team“</text>
<text x="68" y="153.0" font-size="14" fill="#5b6672" text-anchor="start">keine Firma, keine Adresse</text>
<line x1="36" y1="165" x2="364" y2="165" stroke="#d9dee4" stroke-width="1" stroke-linecap="round"/>
<circle cx="44" cy="188" r="13" fill="#c0392b"/>
<text x="44" y="193.5" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="68" y="184.0" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">Nur per WhatsApp melden</text>
<text x="68" y="204.0" font-size="14" fill="#5b6672" text-anchor="start">kein Telefon, keine E-Mail</text>
<line x1="36" y1="216" x2="364" y2="216" stroke="#d9dee4" stroke-width="1" stroke-linecap="round"/>
<circle cx="44" cy="239" r="13" fill="#c0392b"/>
<text x="44" y="244.5" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="68" y="235.0" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">Zahlungen weiterleiten</text>
<text x="68" y="255.0" font-size="14" fill="#5b6672" text-anchor="start">Geld oder Pakete für andere</text>
<line x1="36" y1="267" x2="364" y2="267" stroke="#d9dee4" stroke-width="1" stroke-linecap="round"/>
<circle cx="44" cy="290" r="13" fill="#c0392b"/>
<text x="44" y="295.5" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<text x="68" y="286.0" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">Ausweis + IBAN vorab</text>
<text x="68" y="306.0" font-size="14" fill="#5b6672" text-anchor="start">schon vor dem Gespräch</text>
<line x1="36" y1="318" x2="364" y2="318" stroke="#d9dee4" stroke-width="1" stroke-linecap="round"/>
<circle cx="44" cy="341" r="13" fill="#c0392b"/>
<text x="44" y="346.5" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">6</text>
<text x="68" y="337.0" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">Nur heute! Schnell sein!</text>
<text x="68" y="357.0" font-size="14" fill="#5b6672" text-anchor="start">Druck, damit Sie nicht prüfen</text>
</svg>
