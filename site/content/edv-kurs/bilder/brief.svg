<line x1="130" y1="354.0" x2="262" y2="345" stroke="#1f4e79" stroke-width="1.5" stroke-linecap="round"/>
<text x="266" y="350.0" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="700">Gruß, Name</text>
<text x="266" y="30.0" font-size="15" fill="#5b6672" text-anchor="start">automatisch:</text>
