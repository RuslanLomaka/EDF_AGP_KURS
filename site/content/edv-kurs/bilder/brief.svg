<line x1="198" y1="187.0" x2="262" y2="187" stroke="#1f4e79" stroke-width="1.5" stroke-linecap="round"/>
<text x="266" y="192.0" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="700">Betreff</text>
<rect x="36" y="208" width="116" height="16" rx="3" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.5"/>
