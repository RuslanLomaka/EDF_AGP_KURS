<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Ein fertiger Brief vom Bewerbungshelfer. Blau ist alles, was das Programm einsetzt: Ihre Daten, die Firma, das Datum, den Betreff, die Anrede und den Gruß mit Ihrem Namen. Gelb ist der Teil, den Sie selbst schreiben: 3 bis 5 eigene Sätze.</title>
