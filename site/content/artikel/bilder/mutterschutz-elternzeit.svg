<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Zeitleiste: Mutterschutz von 6 Wochen vor der Geburt bis 8 Wochen nach der Geburt, mit vollem Netto. Danach Elternzeit, bis zu 3 Jahre pro Elternteil, mit Elterngeld vom Staat. Kündigungsschutz vom Beginn der Schwangerschaft bis mindestens 4 Monate nach der Geburt und auch während der Elternzeit.</title>
