<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Mindestkapital: UG ab 1 Euro, GmbH 25.000 Euro, AG 50.000 Euro. Bei allen drei haftet für Schulden nur das Geld der Firma. Das Privatvermögen der Gesellschafter ist geschützt.</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="32.0" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="700">Wie viel Kapital?</text>
<text x="20" y="80.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">UG</text>
<rect x="86" y="58" width="6" height="32" rx="2" fill="#2e7d32"/>
<text x="102" y="80.0" font-size="17" fill="#1d232b" text-anchor="start" font-weight="700">ab 1 €</text>
<text x="20" y="124.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">GmbH</text>
<rect x="86" y="102" width="147" height="32" rx="6" fill="#2e7d32"/>
<text x="160" y="124.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">25.000 €</text>
<text x="20" y="168.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">AG</text>
<rect x="86" y="146" width="294" height="32" rx="6" fill="#2e7d32"/>
<text x="233" y="168.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">50.000 €</text>
<line x1="20" y1="198" x2="380" y2="198" stroke="#d9dee4" stroke-width="2" stroke-linecap="round"/>
<text x="200" y="230.0" font-size="18" fill="#1f4e79" text-anchor="middle" font-weight="700">Schulden? Es haftet nur die Firma.</text>
<path d="M66.0 276.0 L110 255.0 L154.0 276.0 Z" fill="#1f4e79"/>
<rect x="70.0" y="276.0" width="80" height="49.0" rx="0" fill="#e8f0f8" stroke="#1f4e79" stroke-width="3"/>
<rect x="81.2" y="284.4" width="8.0" height="32.2" rx="0" fill="#1f4e79"/>
<rect x="100.4" y="284.4" width="8.0" height="32.2" rx="0" fill="#1f4e79"/>
<rect x="119.6" y="284.4" width="8.0" height="32.2" rx="0" fill="#1f4e79"/>
<rect x="138.8" y="284.4" width="8.0" height="32.2" rx="0" fill="#1f4e79"/>
<text x="110" y="350.0" font-size="16" fill="#1d232b" text-anchor="middle" font-weight="700">Firma zahlt</text>
<line x1="200" y1="252" x2="200" y2="360" stroke="#5b6672" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<path d="M250 290 L290 256 L330 290 V326 H250 Z" fill="#e7f3e8" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="280" y="302" width="20" height="24" rx="2" fill="#2e7d32"/>
<path d="M334 252.75 L349.0 258.96 V269.31 Q349.0 282.075 334 287.25 Q319.0 282.075 319.0 269.31 V258.96 Z" fill="#fff" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="290" y="350.0" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="700">Privat: geschützt</text>
</svg>
