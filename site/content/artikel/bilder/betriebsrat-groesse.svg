<circle cx="300" cy="292" r="7" fill="#1f4e79"/>
<text x="321" y="298" font-size="17" fill="#1f4e79" text-anchor="start" font-weight="700">11</text>
<rect x="10" y="312" width="380" height="38" rx="8" fill="#e8f0f8"/>
<text x="16" y="337" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">701 – 1000</text>
<circle cx="130" cy="332" r="7" fill="#1f4e79"/>
<circle cx="147" cy="332" r="7" fill="#1f4e79"/>
<circle cx="164" cy="332" r="7" fill="#1f4e79"/>
<circle cx="181" cy="332" r="7" fill="#1f4e79"/>
<circle cx="198" cy="332" r="7" fill="#1f4e79"/>
<circle cx="215" cy="332" r="7" fill="#1f4e79"/>
<circle cx="232" cy="332" r="7" fill="#1f4e79"/>
<circle cx="249" cy="332" r="7" fill="#1f4e79"/>
<circle cx="266" cy="332" r="7" fill="#1f4e79"/>
<circle cx="283" cy="332" r="7" fill="#1f4e79"/>
<circle cx="300" cy="332" r="7" fill="#1f4e79"/>
<circle cx="317" cy="332" r="7" fill="#1f4e79"/>
<circle cx="334" cy="332" r="7" fill="#1f4e79"/>
<text x="355" y="338" font-size="17" fill="#1f4e79" text-anchor="start" font-weight="700">13</text>
<text x="200" y="376" font-size="16" fill="#5b6672" text-anchor="middle">Bei mehr Beschäftigten wächst er weiter.</text>
