<circle cx="215" cy="212" r="7" fill="#1f4e79"/>
<circle cx="232" cy="212" r="7" fill="#1f4e79"/>
<text x="253" y="218" font-size="17" fill="#1f4e79" text-anchor="start" font-weight="700">7</text>
<rect x="10" y="232" width="380" height="38" rx="8" fill="#e8f0f8"/>
<text x="16" y="257" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">201 – 400</text>
<circle cx="130" cy="252" r="7" fill="#1f4e79"/>
