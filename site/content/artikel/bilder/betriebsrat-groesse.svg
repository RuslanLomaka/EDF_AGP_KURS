<circle cx="266" cy="252" r="7" fill="#1f4e79"/>
<text x="287" y="258" font-size="17" fill="#1f4e79" text-anchor="start" font-weight="700">9</text>
<text x="16" y="297" font-size="16" fill="#1d232b" text-anchor="start" font-weight="700">401 – 700</text>
<circle cx="130" cy="292" r="7" fill="#1f4e79"/>
<circle cx="147" cy="292" r="7" fill="#1f4e79"/>
<circle cx="164" cy="292" r="7" fill="#1f4e79"/>
