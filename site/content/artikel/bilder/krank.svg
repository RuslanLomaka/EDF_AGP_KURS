<title id="t">Krank im Job, Schritt für Schritt: Am 1. Tag vor Arbeitsbeginn Bescheid sagen. Länger als 3 Tage krank: Krankschreibung vom Arzt. Bis zu 6 Wochen zahlt der Arbeitgeber den Lohn weiter. Danach zahlt die Krankenkasse Krankengeld.</title>
