<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Die duale Ausbildung: zwei Lernorte zur gleichen Zeit. Die meiste Zeit lernen und arbeiten Sie im Betrieb. In der Berufsschule lernen Sie die Theorie, zum Beispiel an 1 bis 2 Tagen pro Woche. Am Ende steht eine Prüfung, danach haben Sie einen Berufsabschluss.</title>
