<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Wie lange darf man arbeiten? Normal höchstens 8 Stunden am Tag. Bis zu 10 Stunden nur mit Ausgleich: Im Durchschnitt von 6 Monaten müssen es wieder 8 Stunden sein. Höchstens 48 Stunden pro Woche, Montag bis Samstag. Nach Feierabend mindestens 11 Stunden Ruhe: Wer um 22 Uhr Feierabend hat, darf frühestens um 9 Uhr wieder anfangen.</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="34.0" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="700">Wie lange arbeiten?</text>
<text x="20" y="88.0" font-size="17" fill="#1d232b" text-anchor="start" font-weight="700">normal</text>
<rect x="132" y="66" width="192" height="32" rx="6" fill="#2e7d32"/>
<text x="228" y="88.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">8 Std.</text>
<text x="20" y="134.0" font-size="17" fill="#1d232b" text-anchor="start" font-weight="700">höchstens</text>
<rect x="132" y="112" width="192" height="32" rx="6" fill="#2e7d32"/>
<rect x="320" y="112" width="52" height="32" rx="6" fill="#b26a00"/>
<text x="228" y="134.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">10 Std.</text>
<text x="132" y="166.0" font-size="15" fill="#5b6672" text-anchor="start">nur mit Ausgleich</text>
<text x="20" y="204.0" font-size="17" fill="#1d232b" text-anchor="start" font-weight="700">Woche</text>
<text x="132" y="204.0" font-size="17" fill="#1d232b" text-anchor="start">höchstens <tspan font-weight="700">48 Std.</tspan> (Mo–Sa)</text>
<line x1="20" y1="226" x2="380" y2="226" stroke="#d9dee4" stroke-width="2" stroke-linecap="round"/>
<text x="200" y="258.0" font-size="19" fill="#1f4e79" text-anchor="middle" font-weight="700">Nach Feierabend: 11 Std. Ruhe</text>
<rect x="20" y="278" width="66" height="36" rx="6" fill="#fff3df" stroke="#b26a00" stroke-width="2"/>
<text x="53" y="302.0" font-size="15" fill="#1d232b" text-anchor="middle">Arbeit</text>
<rect x="90" y="278" width="220" height="36" rx="6" fill="#1f4e79"/>
<text x="200" y="302.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Ruhe: 11 Stunden</text>
<rect x="314" y="278" width="66" height="36" rx="6" fill="#fff3df" stroke="#b26a00" stroke-width="2"/>
<text x="347" y="302.0" font-size="15" fill="#1d232b" text-anchor="middle">Arbeit</text>
<text x="90" y="338.0" font-size="16" fill="#1d232b" text-anchor="middle" font-weight="700">22 Uhr</text>
<text x="312" y="338.0" font-size="16" fill="#1d232b" text-anchor="middle" font-weight="700">9 Uhr</text>
<text x="200" y="378.0" font-size="16" fill="#1d232b" text-anchor="middle">Feierabend 22 Uhr → frühestens 9 Uhr</text>
</svg>
