<title id="t">Gewerbe oder freier Beruf? Ein Gewerbe ist zum Beispiel Handel, Gastronomie oder Handwerk. Es wird beim Gewerbeamt und beim Finanzamt angemeldet. Ein freier Beruf ist zum Beispiel Übersetzer, Lehrerin oder Ärztin. Er wird nur beim Finanzamt angemeldet. Im Zweifel entscheidet das Finanzamt.</title>
