<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Pausen: Bis 6 Stunden Arbeit gibt es keine Pflicht-Pause. Bei mehr als 6 Stunden mindestens 30 Minuten Pause, bei mehr als 9 Stunden mindestens 45 Minuten. Die Pause liegt mitten in der Arbeitszeit und wird meistens nicht bezahlt.</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="34.0" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="700">Wie lange Pause?</text>
<text x="20" y="72.0" font-size="17" fill="#1d232b" text-anchor="start" font-weight="700">bis 6 Std.</text>
<rect x="20" y="84" width="130" height="32" rx="6" fill="#2e7d32"/>
<text x="320" y="108.0" font-size="16" fill="#5b6672" text-anchor="middle" font-weight="700">keine Pflicht</text>
<text x="20" y="158.0" font-size="17" fill="#1d232b" text-anchor="start" font-weight="700">mehr als 6 Std.</text>
<rect x="20" y="170" width="84" height="32" rx="6" fill="#2e7d32"/>
<rect x="140" y="170" width="60" height="32" rx="6" fill="#2e7d32"/>
<rect x="107" y="170" width="30" height="32" rx="6" fill="#ffe58a" stroke="#b26a00" stroke-width="2"/>
<text x="122.0" y="192.0" font-size="15" fill="#b26a00" text-anchor="middle" font-weight="700">P</text>
<text x="320" y="194.0" font-size="20" fill="#b26a00" text-anchor="middle" font-weight="700">30 Min.</text>
<text x="20" y="244.0" font-size="17" fill="#1d232b" text-anchor="start" font-weight="700">mehr als 9 Std.</text>
<rect x="20" y="256" width="100" height="32" rx="6" fill="#2e7d32"/>
<rect x="164" y="256" width="86" height="32" rx="6" fill="#2e7d32"/>
<rect x="123" y="256" width="38" height="32" rx="6" fill="#ffe58a" stroke="#b26a00" stroke-width="2"/>
<text x="142.0" y="278.0" font-size="15" fill="#b26a00" text-anchor="middle" font-weight="700">P</text>
<text x="320" y="280.0" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">45 Min.</text>
<rect x="20" y="316" width="360" height="70" rx="10" fill="#f1f3f5"/>
<rect x="36" y="334" width="22" height="14" rx="3" fill="#ffe58a" stroke="#b26a00" stroke-width="2"/>
<text x="70" y="346.0" font-size="16" fill="#1d232b" text-anchor="start"><tspan font-weight="700">P</tspan> = Pause, mitten in der Arbeit</text>
<text x="70" y="372.0" font-size="16" fill="#1d232b" text-anchor="start">meistens <tspan font-weight="700">ohne Lohn</tspan></text>
</svg>
