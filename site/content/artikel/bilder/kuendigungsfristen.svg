<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Kündigungsfristen, wenn der Arbeitgeber kündigt: weniger als 2 Jahre in der Firma 4 Wochen, ab 2 Jahren 1 Monat, ab 5 Jahren 2 Monate, ab 8 Jahren 3 Monate, ab 10 Jahren 4 Monate, ab 12 Jahren 5 Monate, ab 15 Jahren 6 Monate, ab 20 Jahren 7 Monate.</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="32.0" font-size="20" fill="#1f4e79" text-anchor="middle" font-weight="700">Je länger in der Firma …</text>
<text x="200" y="56.0" font-size="15" fill="#5b6672" text-anchor="middle">… desto länger die Kündigungsfrist</text>
<rect x="26" y="298.38" width="40" height="31.62" rx="4" fill="#4f7fb0"/>
<text x="46" y="290.4" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="700">4 W.</text>
<text x="46" y="352.0" font-size="15" fill="#1d232b" text-anchor="middle" font-weight="700">&lt;2</text>
