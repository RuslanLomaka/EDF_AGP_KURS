<text x="90" y="288.0" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="700">1 M.</text>
<text x="90" y="352.0" font-size="15" fill="#1d232b" text-anchor="middle" font-weight="700">2</text>
