<text x="134" y="254.0" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="700">2 M.</text>
<text x="134" y="352.0" font-size="15" fill="#1d232b" text-anchor="middle" font-weight="700">5</text>
<rect x="158" y="228" width="40" height="102" rx="4" fill="#1f4e79"/>
<text x="178" y="220.0" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="700">3 M.</text>
<text x="178" y="352.0" font-size="15" fill="#1d232b" text-anchor="middle" font-weight="700">8</text>
<rect x="202" y="194" width="40" height="136" rx="4" fill="#1f4e79"/>
<text x="222" y="186.0" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="700">4 M.</text>
<text x="222" y="352.0" font-size="15" fill="#1d232b" text-anchor="middle" font-weight="700">10</text>
<rect x="246" y="160" width="40" height="170" rx="4" fill="#1f4e79"/>
<text x="266" y="152.0" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="700">5 M.</text>
<text x="266" y="352.0" font-size="15" fill="#1d232b" text-anchor="middle" font-weight="700">12</text>
<rect x="290" y="126" width="40" height="204" rx="4" fill="#1f4e79"/>
<text x="310" y="118.0" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="700">6 M.</text>
<text x="310" y="352.0" font-size="15" fill="#1d232b" text-anchor="middle" font-weight="700">15</text>
<rect x="334" y="92" width="40" height="238" rx="4" fill="#1f4e79"/>
<text x="354" y="84.0" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="700">7 M.</text>
<text x="354" y="352.0" font-size="15" fill="#1d232b" text-anchor="middle" font-weight="700">20</text>
<line x1="20" y1="331" x2="380" y2="331" stroke="#5b6672" stroke-width="2" stroke-linecap="round"/>
<text x="200" y="380.0" font-size="15" fill="#5b6672" text-anchor="middle">Jahre in der Firma</text>
<text x="26" y="106.0" font-size="15" fill="#5b6672" text-anchor="start">W. = Wochen</text>
