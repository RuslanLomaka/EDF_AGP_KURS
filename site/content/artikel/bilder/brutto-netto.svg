<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Von Brutto zu Netto, Beispiel Anna mit Steuerklasse I: Von 2.500 Euro brutto gehen ungefähr 540 Euro für die Sozialversicherung und ungefähr 190 Euro Lohnsteuer ab. Es bleiben ungefähr 1.770 Euro netto, rund 70 Prozent. Netto ist das Geld, das auf Ihr Konto kommt.</title>
<defs><marker id="pfeil1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5b6672"/></marker></defs>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="34.0" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="700">Von Brutto zu Netto</text>
<text x="200" y="58.0" font-size="15" fill="#5b6672" text-anchor="middle">Beispiel: Anna, Steuerklasse I</text>
<rect x="20" y="76" width="360" height="52" rx="8" fill="#1f4e79"/>
<text x="200" y="109.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="700">Brutto: 2.500 €</text>
<line x1="200" y1="136" x2="200" y2="164" stroke="#5b6672" stroke-width="4" stroke-linecap="round" marker-end="url(#pfeil1)"/>
<text x="214" y="156.0" font-size="15" fill="#5b6672" text-anchor="start">minus Abzüge</text>
<rect x="20" y="174" width="254" height="52" rx="8" fill="#2e7d32"/>
<rect x="277" y="174" width="76" height="52" rx="6" fill="#b26a00"/>
<rect x="356" y="174" width="24" height="52" rx="6" fill="#c0392b"/>
<text x="147" y="207.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="700">Netto: 1.770 €</text>
<text x="315" y="206.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">540 €</text>
<rect x="24" y="253" width="18" height="18" rx="4" fill="#b26a00"/>
<text x="52" y="268.0" font-size="17" fill="#1d232b" text-anchor="start"><tspan font-weight="700">Sozialversicherung:</tspan> ca. 540 €</text>
<rect x="24" y="289" width="18" height="18" rx="4" fill="#c0392b"/>
<text x="52" y="304.0" font-size="17" fill="#1d232b" text-anchor="start"><tspan font-weight="700">Lohnsteuer:</tspan> ca. 190 €</text>
<rect x="24" y="325" width="18" height="18" rx="4" fill="#2e7d32"/>
<text x="52" y="340.0" font-size="17" fill="#1d232b" text-anchor="start"><tspan font-weight="700">Netto:</tspan> ca. 1.770 € = rund 70 %</text>
<text x="200" y="384.0" font-size="15" fill="#5b6672" text-anchor="middle">Netto = das Geld auf Ihrem Konto</text>
</svg>
