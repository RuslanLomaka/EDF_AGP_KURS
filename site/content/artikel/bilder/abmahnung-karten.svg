<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Die Abmahnung ist wie die gelbe Karte im Fußball. Erst ein Fehlverhalten, zum Beispiel zu spät kommen. Dann die Abmahnung: eine Warnung vor der Kündigung. Passiert es wieder, kann die rote Karte folgen: die Kündigung. Wegen Krankheit gibt es keine Abmahnung.</title>
<defs><marker id="pfeil1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5b6672"/></marker></defs>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="34.0" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="700">Gelbe Karte, rote Karte</text>
<circle cx="62" cy="96" r="26" fill="#fff" stroke="#b26a00" stroke-width="3"/>
<line x1="62" y1="96" x2="62" y2="80.4" stroke="#b26a00" stroke-width="3" stroke-linecap="round"/>
<line x1="62" y1="96" x2="73.7" y2="101.2" stroke="#b26a00" stroke-width="3" stroke-linecap="round"/>
<text x="108" y="90.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Fehlverhalten</text>
<text x="108" y="114.0" font-size="16" fill="#5b6672" text-anchor="start">z. B. zu spät kommen</text>
<line x1="62" y1="130" x2="62" y2="158" stroke="#5b6672" stroke-width="3" stroke-linecap="round" marker-end="url(#pfeil1)"/>
<rect x="42" y="168" width="40" height="56" rx="4" fill="#f5c518" stroke="#b68f00" stroke-width="2" transform="rotate(-8 62 196)"/>
<text x="108" y="190.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Abmahnung</text>
<text x="108" y="214.0" font-size="16" fill="#5b6672" text-anchor="start">Warnung vor der Kündigung</text>
<line x1="62" y1="234" x2="62" y2="262" stroke="#5b6672" stroke-width="3" stroke-linecap="round" marker-end="url(#pfeil1)"/>
<text x="78" y="254.0" font-size="15" fill="#5b6672" text-anchor="start">wieder?</text>
<rect x="42" y="272" width="40" height="56" rx="4" fill="#c0392b" stroke="#8e2a20" stroke-width="2" transform="rotate(8 62 300)"/>
<text x="108" y="294.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Kündigung</text>
<text x="108" y="318.0" font-size="16" fill="#5b6672" text-anchor="start">ist jetzt möglich</text>
<rect x="20" y="346" width="360" height="40" rx="10" fill="#f1f3f5"/>
<text x="200" y="372.0" font-size="16" fill="#1d232b" text-anchor="middle">Keine Abmahnung wegen <tspan font-weight="700">Krankheit</tspan></text>
</svg>
