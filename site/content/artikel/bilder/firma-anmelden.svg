<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Anmelden in vier Schritten: 1. Gewerbeamt, wenn Sie anfangen, meist 10 bis 65 Euro. 2. Finanzamt: innerhalb von 1 Monat den Fragebogen über ELSTER schicken. 3. Handelsregister: nur für Kaufleute und Gesellschaften wie OHG, KG, GmbH und UG, über einen Notar. 4. Versicherungen: Kranken- und Pflegeversicherung sind Pflicht.</title>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="32.0" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="700">Anmelden – Schritt für Schritt</text>
<line x1="36" y1="80" x2="36" y2="330" stroke="#d9dee4" stroke-width="4" stroke-linecap="round"/>
<rect x="60" y="56" width="326" height="62" rx="10" fill="#f1f3f5"/>
<circle cx="36" cy="76" r="15" fill="#1f4e79"/>
<text x="36" y="82.3" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="74" y="82.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Gewerbeamt</text>
<text x="74" y="104.0" font-size="15" fill="#5b6672" text-anchor="start">beim Start · meist 10–65 €</text>
<rect x="60" y="130" width="326" height="62" rx="10" fill="#f1f3f5"/>
<circle cx="36" cy="150" r="15" fill="#1f4e79"/>
<text x="36" y="156.3" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="74" y="156.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Finanzamt</text>
<text x="74" y="178.0" font-size="15" fill="#5b6672" text-anchor="start">in 1 Monat · Fragebogen über ELSTER</text>
<rect x="60" y="212" width="326" height="84" rx="10" fill="#fff" stroke="#b5bcc4" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="36" cy="232" r="15" fill="#5b6672"/>
<text x="36" y="238.3" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="74" y="238.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Handelsregister</text>
<text x="74" y="260.0" font-size="15" fill="#5b6672" text-anchor="start">nur Kaufleute und Gesellschaften</text>
<text x="74" y="279.5" font-size="15" fill="#5b6672" text-anchor="start">(OHG, KG, GmbH, UG) · über Notar</text>
<rect x="60" y="304" width="326" height="62" rx="10" fill="#f1f3f5"/>
<circle cx="36" cy="324" r="15" fill="#1f4e79"/>
<text x="36" y="330.3" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="74" y="330.0" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">Versicherungen</text>
<text x="74" y="352.0" font-size="15" fill="#5b6672" text-anchor="start">Kranken- und Pflegeversicherung: Pflicht</text>
</svg>
