<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t">
<title id="t">Der 1. Bildungsweg: Kinder und Jugendliche gehen ihn ohne Pause. Zuerst die Grundschule, Klasse 1 bis 4, in einigen Bundesländern bis 6. Dann eine weiterführende Schule: Hauptschule, Realschule, Gymnasium oder Gesamtschule. Dann ein Schulabschluss: Erster Schulabschluss, Mittlerer Schulabschluss, Fachhochschulreife oder Abitur. Danach kommen Ausbildung, Studium oder Beruf.</title>
<defs><marker id="pf" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5b6672"/></marker></defs>
<rect width="400" height="400" fill="#ffffff"/>
<text x="200" y="30" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="700">Der 1. Bildungsweg</text>
<text x="200" y="52" font-size="15" fill="#5b6672" text-anchor="middle">Kinder und Jugendliche, ohne Pause</text>
<rect x="60" y="66" width="280" height="56" rx="10" fill="#e8f0f8"/>
<text x="200.0" y="88" font-size="17" fill="#1d232b" text-anchor="middle" font-weight="700">Grundschule</text>
<text x="200.0" y="109" font-size="15" fill="#1d232b" text-anchor="middle">Klasse 1 bis 4 (teils bis 6)</text>
<rect x="60" y="138" width="280" height="76" rx="10" fill="#e8f0f8"/>
<text x="200.0" y="160" font-size="17" fill="#1d232b" text-anchor="middle" font-weight="700">Weiterführende Schule</text>
<text x="200.0" y="181" font-size="15" fill="#1d232b" text-anchor="middle">Hauptschule · Realschule</text>
<text x="200.0" y="200" font-size="15" fill="#1d232b" text-anchor="middle">Gymnasium · Gesamtschule</text>
<rect x="60" y="229" width="280" height="76" rx="10" fill="#cfe0f1"/>
<text x="200.0" y="251" font-size="17" fill="#1d232b" text-anchor="middle" font-weight="700">Schulabschluss</text>
<text x="200.0" y="272" font-size="15" fill="#1d232b" text-anchor="middle">Erster · Mittlerer · Fach-</text>
<text x="200.0" y="291" font-size="15" fill="#1d232b" text-anchor="middle">hochschulreife · Abitur</text>
<rect x="60" y="320" width="280" height="56" rx="10" fill="#1f4e79"/>
<text x="200.0" y="342" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">Danach</text>
<text x="200.0" y="363" font-size="15" fill="#ffffff" text-anchor="middle">Ausbildung · Studium · Beruf</text>
<line x1="200" y1="123" x2="200" y2="135" stroke="#5b6672" stroke-width="3" stroke-linecap="round" marker-end="url(#pf)"/>
<line x1="200" y1="215" x2="200" y2="226" stroke="#5b6672" stroke-width="3" stroke-linecap="round" marker-end="url(#pf)"/>
<line x1="200" y1="306" x2="200" y2="317" stroke="#5b6672" stroke-width="3" stroke-linecap="round" marker-end="url(#pf)"/>
</svg>
