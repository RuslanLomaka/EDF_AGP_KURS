<title id="t">Das Kündigungsschutzgesetz gilt, wenn Sie länger als 6 Monate in der Firma arbeiten und die Firma mehr als 10 Beschäftigte hat. Dann braucht eine ordentliche Kündigung einen von drei Gründen: im Verhalten, in der Person oder im Betrieb.</title>
