name: Build and deploy

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pandoc, ffmpeg and Piper
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends pandoc ffmpeg python3-venv
          pandoc --version | head -1
          python3 -m venv .venv
          .venv/bin/pip install -q piper-tts==1.8.0 pyyaml==6.0.3

      # Voice model and already rendered words are reused between builds; only new words are rendered.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .piper
            site/.audio-cache
          key: piper-thorsten-${{ hashFiles('site/content/artikel/*.md') }}
          restore-keys: piper-thorsten-

      # German voice "Thorsten" (open source, dataset CC0), pinned to a commit and checked by hash
      - name: Download German voice
        run: |
          mkdir -p .piper && cd .piper
          base=https://huggingface.co/rhasspy/piper-voices/resolve/b4e358ffcb232591bf73a540e70f7de528e4174a/de/de_DE/thorsten/medium
          for f in de_DE-thorsten-medium.onnx de_DE-thorsten-medium.onnx.json; do
            [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" "$base/$f"
          done
          sha256sum -c <<'SUMS'
          7e64762d8e5118bb578f2eea6207e1a35a8e0c30595010b666f983fc87bb7819  de_DE-thorsten-medium.onnx
          974adee790533adb273a1ac88f49027d2a1b8f0f2cf4905954a4791e79264e85  de_DE-thorsten-medium.onnx.json
          SUMS

      # The lesson "Bewerbungshelfer" offers a small Windows program; it is built here from its Go source.
      - name: Build Bewerbungshelfer program
        run: |
          command -v go >/dev/null || { sudo apt-get install -y -q --no-install-recommends golang-go; }
          go version
          materials/bewerbungshelfer/build_exe.sh

      - name: Build
        env:
          PIPER_MODEL: .piper/de_DE-thorsten-medium.onnx
        run: .venv/bin/python site/build.py

      - name: Package release
        run: |
          mkdir -p release
          cp -r site/dist release/html
          cp deploy/compose.yaml deploy/nginx.conf release/
          tar -C release -czf release.tar.gz .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to Raspberry Pi
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only deploys queue here; builds of other branches and pull requests never cancel a waiting deploy.
    concurrency:
      group: kursmaterial-deploy
      cancel-in-progress: false
    env:
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_USER: ${{ secrets.PI_USER }}
    steps:
      - name: Check deploy secrets
        env:
          HAS_ALL: ${{ secrets.PI_HOST != '' && secrets.PI_USER != '' && secrets.PI_SSH_PRIVATE_KEY != '' && secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
        run: |
          if [ "$HAS_ALL" != "true" ]; then
            echo "::error::Not all repository secrets are set (PI_HOST, PI_USER, PI_SSH_PRIVATE_KEY, TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET)."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Configure SSH
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Keys pasted on Windows arrive with CRLF line endings, which ssh rejects ("error in libcrypto").
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/kursmaterial_deploy
          chmod 600 ~/.ssh/kursmaterial_deploy
          if ! ssh-keygen -y -f ~/.ssh/kursmaterial_deploy >/dev/null 2>&1; then
            echo "::error::PI_SSH_PRIVATE_KEY is not a valid private key. Paste the whole content of the file kursmaterial_deploy (the one WITHOUT .pub), including the BEGIN and END lines."
            exit 1
          fi
          # stderr would print the Pi's SSH version into the public log
          ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not read the Pi's SSH host key."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          printf 'Host pi\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/kursmaterial_deploy\n  BatchMode yes\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' \
            "$PI_HOST" "$PI_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Before anything is changed on the Pi: port 8090 must be free or already ours.
      - name: Check port 8090 on the Pi
        run: |
          ssh pi 'bash -s' <<'REMOTE'
          set -euo pipefail
          listening="$(ss -Hltn 'sport = :8090')"
          if [ -n "$listening" ]; then
            names="$(docker ps --format '{{.Names}}')"
            if grep -qx kursmaterial-web <<<"$names"; then
              echo "Port 8090 is used by our own container (kursmaterial-web): OK."
            else
              echo "::error::Port 8090 on the Pi is used by another program. Nothing was changed."
              exit 1
            fi
          else
            echo "Port 8090 is free."
          fi
          REMOTE

      - name: Upload release to the Pi
        run: |
          ssh pi \
            'set -e; D="$HOME/projects/kursmaterial"; mkdir -p "$D"; rm -rf "$D/incoming"; mkdir "$D/incoming"; tar -xzf - -C "$D/incoming"' \
            < release.tar.gz

      # If the new version does not answer, the previous one is restored and the job fails.
      - name: Start new version, roll back if it does not answer
        run: |
          ssh pi 'bash -s' <<'REMOTE'
          set -euo pipefail
          D="$HOME/projects/kursmaterial"
          cd "$D"
          check() {
            if command -v curl >/dev/null; then curl -fsS -o /dev/null "$1"; else wget -q -O /dev/null "$1"; fi
          }
          healthy() {
            for i in $(seq 1 20); do
              if check http://127.0.0.1:8090/ && check http://127.0.0.1:8090/artikel/ && check http://127.0.0.1:8090/edv-kurs/; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          rm -rf html.previous compose.yaml.previous nginx.conf.previous
          if [ -d html ]; then mv html html.previous; fi
          if [ -f compose.yaml ]; then cp compose.yaml compose.yaml.previous; fi
          if [ -f nginx.conf ]; then cp nginx.conf nginx.conf.previous; fi
          mv incoming/html html
          mv incoming/compose.yaml incoming/nginx.conf .
          rmdir incoming
          if docker compose up -d --force-recreate --remove-orphans --pull always && healthy; then
            echo "Site is up on 127.0.0.1:8090."
            exit 0
          fi
          echo "::error::The new version does not answer on 127.0.0.1:8090. Rolling back."
          # startup errors only: access log lines would put visitors' IP addresses into the public log
          docker compose logs --no-log-prefix 2>&1 | grep -E '\[(emerg|alert|crit)\]' | tail -20 || true
          if [ -d html.previous ]; then
            rm -rf html
            mv html.previous html
            if [ -f compose.yaml.previous ]; then mv compose.yaml.previous compose.yaml; fi
            if [ -f nginx.conf.previous ]; then mv nginx.conf.previous nginx.conf; fi
            if docker compose up -d --force-recreate --remove-orphans && healthy; then
              echo "::error::Previous version restored. The new version was NOT deployed."
            else
              echo "::error::The previous version could not be restored either."
            fi
          fi
          exit 1
          REMOTE
