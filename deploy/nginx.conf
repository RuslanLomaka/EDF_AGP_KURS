server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Redirects (e.g. /artikel -> /artikel/) keep the browser's scheme and host instead of http://localhost
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Inline styles are needed for pandoc's table alignment; scripts only from our own files.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1h;
    }
}
