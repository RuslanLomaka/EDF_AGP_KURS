# Kursmaterial web server on the Raspberry Pi.
# Reachable only from the Pi itself (127.0.0.1:8090); the Cloudflare Tunnel makes it public.
# Its own compose project, so it never touches other stacks on the Pi.
name: kursmaterial

services:
  web:
    # Official nginx image that runs as a non-root user (listens on 8080 inside the container).
    # The deploy runs `docker compose up --pull always`, so security updates arrive with every deploy.
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: kursmaterial-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 64m
