# Kursmaterial web server on the Raspberry Pi.
# Reachable only from the Pi itself (127.0.0.1:8090); the Cloudflare Tunnel makes it public.
# Its own compose project, so it never touches other stacks on the Pi.
name: kursmaterial

services:
  web:
    # Official nginx image that runs as a non-root user (listens on 8080 inside the container).
    # Pinned exact tag + digest (Decision: Dependabot proposes updates; no floating "stable").
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    container_name: kursmaterial-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 64m
